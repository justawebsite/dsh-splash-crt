# ============================================================================
# dsh-splash-crt —— DSH bundle patch（挂载声明）
# ----------------------------------------------------------------------------
# 本文件把开屏动画插件的宿主半区插入 profile 配置树。浏览器半区不通过客户端
# 模块注册表加载（桌面端的 __DSH_BOOT__ 由安装包静态 dist 直出），而是由宿主
# 半区经 `webserver/index-inject` 注册一条内联 script 行，页面侧自举加载
# `/dsh-splash/client.js` 并自挂载到 DOM。
#
# 安装（本地开发）：
#   dsh plugin --profile desktop add link:<本目录绝对路径>
# 安装后需要重启 DSH 桌面端：`webserver/index-inject` 的行表是宿主启动时
# 一次性收集的，运行期新增的插件行不一定能进入已缓存的表。
# ============================================================================

- insert:
    - id: dsh-splash-crt
      name: dsh-splash-crt
